    <style>
      .whats-new-sparkle {
        animation: whats-new-float 2.2s ease-in-out infinite;
      }

      @keyframes whats-new-float {
        0% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-2px) scale(1.08);
        }
        100% {
          transform: translateY(0) scale(1);
        }
      }

      /* Boot overlay: visible before app.css/JS so first paint isn’t janky */
      #appBootOverlay.app-boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        transition:
          opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #appBootOverlay.app-boot-overlay--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-boot-overlay__inner {
        text-align: center;
      }

      /* Match .text-gradient-solar before app.css loads */
      .app-boot-overlay__mark {
        font-family: "Mulish", system-ui, sans-serif;
        font-size: 1.35rem;
        font-weight: 1000;
        letter-spacing: -0.02em;
        background-image:
          radial-gradient(
            ellipse 26% 36% at 100% 100%,
            #09dd97 0%,
            transparent 68%
          ),
          linear-gradient(112deg, #00b0ff 0%, #008ac8 82%);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      .app-boot-overlay__spinner {
        width: 2rem;
        height: 2rem;
        margin: 1.1rem auto 0;
        border: 2px solid rgba(148, 163, 184, 0.28);
        border-top-color: #00b0ff;
        border-radius: 50%;
        animation: app-boot-spin 0.72s linear infinite;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="manifest" href="./manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AyahDay" />
    <meta property="og:url" content="https://www.ayahday.cc/" />
    <meta
      property="og:title"
      content="AyahDay - Daily Quran Verses in English, Arabic, Urdu &amp; Malay"
    />
    <meta
      property="og:description"
      content="Free web app for daily Quranic verses in English, Arabic, Urdu, and Malay. Reflect, navigate, and share. Powered by Al Quran Cloud."

    <meta name="twitter:card" content="summary_large_image" />
    <meta

    <script type="application/ld+json">

        "featureList": "Daily ayah reflection, English, Arabic, Urdu, and Malay Quran text and translations, WhatsApp sharing, Al Quran Cloud API",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "PKR"
        },

    <!-- Google tag (gtag.js) -->
    <script

      src="https://www.googletagmanager.com/gtag/js?id=G-72MT997T35"

  <body class="app-body min-h-screen p-4 md:p-8">
    <div
      id="appBootOverlay"
      class="app-boot-overlay"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-busy="true"
      aria-label="Loading AyahDay"
    >
      <div class="app-boot-overlay__inner">
        <div class="app-boot-overlay__mark font-logo text-gradient-solar">
          AyahDay
        </div>
        <div class="app-boot-overlay__spinner"></div>
      </div>
    </div>
    <div class="theme mx-auto w-full max-w-2xl">
      <header class="mb-8">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h1
              class="element-to-hide font-logo m-0 text-2xl tracking-tight text-gradient-solar sm:text-3xl"
              id="gradientLogo"
            >
              AyahDay
            </h1>
            <p
              class="app-tagline element-to-hide mt-0.5 text-xs font-medium"
              id="tagline"
            >
              Daily Quranic Verses
            </p>
            <h1
              id="screenshotLogo"
              class="hidden font-logo text-2xl font-extrabold text-white"
            >
              <span class="text-solar-green-400">AyahDay.cc</span>
              <span class="mt-1 block text-base font-bold text-solar-blue-300">
                Daily Quranic Verses
              </span>
            </h1>
          </div>
          <div
            class="header-actions element-to-hide flex shrink-0 items-center gap-3"
          >
            <span class="header-icon-wrap">
              <button
                type="button"
                id="updatesBellBtn"
                class="header-icon-btn"
                aria-label="What's new"
                title="What's new"
              >
                <span
                  class="material-symbols-outlined header-icon-btn__glyph"
                  aria-hidden="true"
                  >notifications</span
                >
              </button>
              <span
                id="updatesBellHint"
                class="header-tooltip header-tooltip--bell"
                role="tooltip"
                hidden
              ></span>
            </span>
            <span class="header-icon-wrap">
              <button
                type="button"
                id="themeToggleBtn"
                class="header-icon-btn"
                aria-label="Switch to dark mode"
                title="Dark mode"
              >
                <span
                  class="material-symbols-outlined header-icon-btn__glyph"
                  aria-hidden="true"
                  >contrast</span
                >
              </button>
              <span
                id="themeToggleHint"
                class="header-tooltip header-tooltip--theme"
                role="tooltip"
                hidden
              ></span>
            </span>
            <div id="saved-menu" class="saved-menu" data-open="false">
              <button
                type="button"
                id="savedMenuTrigger"
                class="saved-menu-trigger"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="savedMenuDropdown"
                aria-describedby="savedMenuHint"
                aria-label="Your saved reflections"
              >
                <span
                  class="material-symbols-outlined header-icon-btn__glyph"
                  aria-hidden="true"
                  >favorite</span
                >
              </button>
              <span
                id="savedMenuHint"
                class="header-tooltip header-tooltip--saved"
                role="tooltip"
                hidden
              ></span>
              <div
                id="savedMenuDropdown"
                class="saved-menu-dropdown"
                role="menu"
                aria-hidden="true"
              >
                <span class="saved-menu-caret" aria-hidden="true"></span>
                <ul id="savedReflectionsList" class="saved-menu-list"></ul>
                <p id="savedReflectionsEmpty" class="saved-menu-empty" hidden>
                  No saved ayahs yet
                </p>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main>
        <div class="mb-3 flex items-center justify-between gap-3">
          <div
            id="datetime"
            class="text-sm font-medium text-solar-slate-400"
          ></div>
          <p
            id="swipeInstruction"
            class="element-to-hide flex items-center gap-1.5 text-sm text-slate-500 dark:text-slate-400"
          >
            <span class="material-symbols-outlined text-base" aria-hidden="true"
              >swipe</span
            >
            Swipe left or right
          </p>
        </div>
        <div
          id="verseDisplay"
          class="ayah-day-verse-panel glass-card mb-6 flex flex-col justify-center rounded-xl p-4 text-card-foreground ring-1 ring-solar-blue-500/25 md:p-5"
        >
          <div id="verseContent"></div>
          <div
            id="versePanelFooter"
            class="verse-panel-footer element-to-hide"
            hidden
          >
            <small id="surahMeta" class="surah"></small>
            <button
              type="button"
              id="saveAyahBtn"
              class="save-ayah-btn"
              aria-label="Save ayah"
              aria-pressed="false"
              title="Save ayah"
            >
              <svg
                class="save-ayah-btn__icon"
                viewBox="0 0 24 24"
                width="26"
                height="26"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  class="save-ayah-btn__heart-outline"
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linejoin="round"
                />
                <path
                  class="save-ayah-btn__heart-filled"
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
        </div>
        <div
          class="element-to-hide flex w-full flex-wrap items-center justify-between gap-3"
        >
          <div class="lang-menu" id="language-menu" data-open="false">
            <button
              type="button"
              id="language-trigger"
              class="lang-trigger"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="language-menu-content"
              aria-label="Select translation language"
            >
              <span id="language-trigger-label">English</span>
              <svg
                class="lang-chevron"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M6 9L12 15L18 9"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div
              id="language-menu-content"
              class="lang-content"
              role="menu"
              hidden
            >
              <button
                type="button"
                class="lang-option"
                role="menuitemradio"
                data-language="en.asad"
                aria-checked="false"
              >
                English
              </button>
              <button
                type="button"
                class="lang-option"
                role="menuitemradio"
                data-language="quran-uthmani"
                aria-checked="false"
              >
                Arabic
              </button>
              <button
                type="button"
                class="lang-option"
                role="menuitemradio"
                data-language="ur.maududi"
                aria-checked="false"
              >
                Urdu
              </button>
              <button
                type="button"
                class="lang-option"
                role="menuitemradio"
                data-language="ms.basmeih"
                aria-checked="false"
              >
                Malay
              </button>
            </div>
          </div>
          <div class="flex flex-wrap gap-2" dir="ltr" lang="en">
            <span class="element-to-hide relative inline-flex">
              <button
                type="button"
                id="shareBtn"
                class="btn-icon-whatsapp"
                aria-describedby="shareTooltip"
                aria-label="Share on WhatsApp"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="size-4 shrink-0"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="#ffffff"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <!-- Lucide MessageCircle (ISC) - matches solar-helper ResultsSidebar -->
                  <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
                </svg>
              </button>
              <div
                id="shareTooltip"
                role="tooltip"
                class="share-tooltip element-to-hide"
              >
                <span id="shareTooltipLabel">Share on WhatsApp</span>
              </div>
            </span>
            <button
              type="button"
              id="prevBtn"
              class="btn-icon"
              aria-label="Previous verse"
            >
              <i class="fa-solid fa-caret-left" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              id="nextBtn"
              class="btn-icon"
              aria-label="Next verse"
            >
              <i class="fa-solid fa-caret-right" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </main>

      <footer
        dir="ltr"
        class="mt-10 border-t border-slate-200/80 pt-4 text-left text-xs text-slate-500 dark:border-white/10 dark:text-slate-400"
      >
        <p style="margin-bottom: 4px">
          © <span id="footerYear"></span> AyahDay
        </p>
        <p
          class="mt-2 text-slate-500/80 dark:text-slate-400/70"
          style="font-size: 11px; margin-bottom: 4px"
        >
          Help me improve AyahDay. Share feedback!
        </p>
        <div
          class="mt-2 flex flex-wrap items-center gap-2 text-xs text-slate-600 dark:text-slate-300"
        >
          <a
            href="./faq/"
            class="underline underline-offset-2 hover:text-cyan-200"
            style="text-decoration: underline; text-underline-offset: 2px"
            >FAQ</a
          >
          <span class="text-slate-500" aria-hidden="true">•</span>
          <button
            type="button"
            class="underline underline-offset-2 hover:text-cyan-200"
            aria-label="Share your feedback"
            title="Share your feedback"
            data-tally-open="xXR2ek"
            data-tally-hide-title="1"
            data-tally-overlay="1"
            data-tally-emoji-text="🕋"
            data-tally-emoji-animation="heart-beat"
            data-tally-auto-close="0"
            data-tally-form-events-forwarding="1"
            style="text-decoration: underline; text-underline-offset: 2px"
          >
            Feedback
          </button>
        </div>
      </footer>
    </div>

    <div
      id="sharePreviewModal"
      class="share-preview-modal"
      hidden
      aria-hidden="true"
    >
      <button
        type="button"
        id="sharePreviewBackdrop"
        class="share-preview-modal__backdrop"
        aria-label="Close share preview"
      ></button>
      <div
        class="share-preview-modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sharePreviewDialogTitle"
      >
        <div class="mb-3 flex items-center justify-between gap-2">
          <h2
            id="sharePreviewDialogTitle"
            class="text-sm font-semibold text-slate-800 dark:text-slate-200"
          >
            Share preview
          </h2>
          <button
            type="button"
            id="sharePreviewClose"
            class="btn-icon h-9 w-9 shrink-0"
            aria-label="Close"
          >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div id="sharePreviewCaptureRoot" class="share-preview-capture"></div>
        <button
          type="button"
          id="sharePreviewConfirm"
          class="share-preview-confirm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="size-4 shrink-0"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="#ffffff"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
          </svg>
          Share Now
        </button>
      </div>
    </div>

    <div id="updatesModal" class="updates-modal" hidden aria-hidden="true">
      <button
        type="button"
        id="updatesModalBackdrop"
        class="updates-modal__backdrop"
        aria-label="Close updates"
      ></button>
      <div
        class="updates-modal__sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="updatesModalTitle"
      >
        <header class="updates-modal__header">
          <h2 id="updatesModalTitle" class="updates-modal__title">
            What's New
          </h2>
          <button
            type="button"
            id="updatesModalClose"
            class="header-icon-btn header-icon-btn--on-panel"
            aria-label="Close"
          >
            <span
              class="material-symbols-outlined header-icon-btn__glyph"
              aria-hidden="true"
              >close</span
            >
          </button>
        </header>
        <div id="updatesModalCards" class="updates-modal__cards"></div>
        <footer class="updates-modal__footer">
          <button
            type="button"
            id="updatesModalGotIt"
            class="updates-modal__got-it"
          >
            Got it
          </button>
        </footer>
      </div>
    </div>

    <div
      id="saveToast"
      class="save-toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <script>
      document.getElementById("footerYear").textContent =
        new Date().getFullYear();
    </script>
    <script src="theme.js"></script>
    <script src="script.js"></script>
  </body>
</html>
